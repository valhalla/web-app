name: PR Preview Build

# Runs the PR's (untrusted) code with no secrets and a read-only token. The
# deploy happens in preview-deploy.yml, which never executes anything from
# this artifact — it only ships the static files.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'docker*'
      - 'Docker*'

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📝 Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr_number.txt

      # Served at https://<preview host>/<org>/<repo>/<pr>/ — vite's base only
      # needs the path (see getBaseUrl in vite.config.ts).
      - name: 🏠 Set preview base path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm pkg set homepage="/${GITHUB_REPOSITORY}/${PR_NUMBER}/"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 🔧 Install and build
        run: |
          npm ci
          npm run build

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: |
            ./build
            pr_number.txt
          retention-days: 1
